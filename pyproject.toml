[project]
name = "mockup3d"
version = "0.1.0"
description = "사진·특허도면 → AI 파라메트릭 목업 → 3D 프린터 출력"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.12",
  "fastapi>=0.110",
  "httpx>=0.27",
  "manifold3d>=3.0",
  "numpy>=1.26",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mockup3d = "mockup3d.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mockup3d*"]

[tool.setuptools.package-data]
mockup3d = ["static/*"]
